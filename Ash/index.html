<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ash — I'm Lost</title>
<style>
:root{font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#171717;display:grid;place-items:center;min-height:100vh}.card{width:min(92%,480px);background:white;border-radius:24px;padding:28px;text-align:center;box-shadow:0 10px 35px #0002}.alert{font-size:clamp(2rem,10vw,3.4rem);font-weight:900;margin:0}.name{font-size:2rem;margin:.25rem 0}.photo{aspect-ratio:1/1;border:3px dashed #aaa;border-radius:18px;display:grid;place-items:center;margin:20px 0;color:#666}.lead{font-size:1.2rem;line-height:1.45}.button{display:block;margin-top:18px;padding:16px;border-radius:14px;background:#171717;color:white;text-decoration:none;font-size:1.15rem;font-weight:bold}.small{margin-top:22px;color:#666;font-size:.9rem}</style>
</head>
<body>
  <main class="card">
    <p class="alert">I'M LOST</p>
    <h1 class="name">My name is Ash 🐕</h1>
    <div class="photo">
      <img src="../images/ash.jpg" alt="Ash">
    </div>
    <p class="lead">I'm a Silver Labrador. If you've found me, thank you for keeping me safe. Please contact my owner.</p>
    <a class="button" href="#contact">CONTACT MY OWNER</a>
    <p id="contact" class="small">Owner contact details will be added here.</p>
  </main>
</body>
</html>
